<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 461" width="640" height="461" role="img"><title>Everything that went live in Gramlet, from the restart in December 2025 to Halloween 2026</title><style>
svg{--ink:#1d1b18;--muted:#6a6359;--grid:#e7dfd2;--dot:#1a6aa8}
@media (prefers-color-scheme: dark){svg{--ink:#ece8e1;--muted:#a39d93;--grid:#2e3137;--dot:#5aa3dc}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;fill:var(--muted)}
.ink{fill:var(--ink)} .b{font-weight:600} .s{font-size:13.5px}
.spine{stroke:var(--grid);stroke-width:3;stroke-linecap:round} .dot{fill:var(--dot)} .ring{fill:none;stroke:var(--dot);stroke-width:2}
</style><line class="spine" x1="118" x2="118" y1="22.0" y2="439.2"/><text x="104" y="27.0" text-anchor="end" class="s">26 Dec 2025</text><circle cx="118" cy="22.0" r="6.5" class="dot"/><text x="134" y="27.0"><tspan class="ink b">The restart</tspan><tspan dx="8">Anagramageddon, back from the dead</tspan></text><text x="104" y="50.0" text-anchor="end" class="s">5 Jan</text><circle cx="118" cy="45.0" r="5.5" class="dot"/><text x="134" y="50.0"><tspan class="ink b">Daily Challenge</tspan><tspan dx="8">one grid a day, 8 turns</tspan></text><text x="104" y="73.0" text-anchor="end" class="s">21 Jan</text><circle cx="118" cy="68.0" r="5.5" class="dot"/><text x="134" y="73.0"><tspan class="ink b">Renamed Gramlet</tspan></text><text x="104" y="96.0" text-anchor="end" class="s">25 Jan</text><circle cx="118" cy="91.0" r="5.5" class="dot"/><text x="134" y="96.0"><tspan class="ink b">Fog of War</tspan><tspan dx="8">letters hidden until you get close</tspan></text><text x="104" y="119.0" text-anchor="end" class="s">13 Feb</text><circle cx="118" cy="114.0" r="5.5" class="dot"/><text x="134" y="119.0"><tspan class="ink b">Free Play</tspan><tspan dx="8">every letter showing, undo allowed</tspan></text><text x="104" y="142.0" text-anchor="end" class="s">27 Feb</text><circle cx="118" cy="137.0" r="5.5" class="dot"/><text x="134" y="142.0"><tspan class="ink b">Triplet</tspan><tspan dx="8">3 bonus challenges a day</tspan></text><text x="104" y="165.0" text-anchor="end" class="s">14 Mar</text><circle cx="118" cy="160.0" r="5.5" class="dot"/><text x="134" y="165.0"><tspan class="ink b">Scorecards</tspan><tspan dx="8">the post-game slideshow</tspan></text><text x="104" y="188.0" text-anchor="end" class="s">5 Apr</text><circle cx="118" cy="183.0" r="5.5" class="dot"/><text x="134" y="188.0"><tspan class="ink b">Friends</tspan><tspan dx="8">and head-to-head records</tspan></text><text x="104" y="211.0" text-anchor="end" class="s">13 Apr</text><circle cx="118" cy="206.0" r="5.5" class="dot"/><text x="134" y="211.0"><tspan class="ink b">Volt</tspan><tspan dx="8">the one that took over my life</tspan></text><text x="104" y="234.0" text-anchor="end" class="s">10 May</text><circle cx="118" cy="229.0" r="5.5" class="dot"/><text x="134" y="234.0"><tspan class="ink b">Charity pot</tspan><tspan dx="8">10p a game, players pick the charity</tspan></text><text x="104" y="257.0" text-anchor="end" class="s">6 Jun</text><circle cx="118" cy="252.0" r="5.5" class="dot"/><text x="134" y="257.0"><tspan class="ink b">VoltArena</tspan><tspan dx="8">Volt, head-to-head, in real time</tspan></text><text x="104" y="280.0" text-anchor="end" class="s">18 Jun</text><circle cx="118" cy="275.0" r="5.5" class="dot"/><text x="134" y="280.0"><tspan class="ink b">Grambots</tspan><tspan dx="8">a career ladder against bots</tspan></text><text x="104" y="303.0" text-anchor="end" class="s">25 Jun</text><circle cx="118" cy="298.0" r="5.5" class="dot"/><text x="134" y="303.0"><tspan class="ink b">Gramlet Kids</tspan><tspan dx="8">no clock, no pressure</tspan></text><text x="104" y="326.0" text-anchor="end" class="s">22 Jul</text><circle cx="118" cy="321.0" r="5.5" class="dot"/><text x="134" y="326.0"><tspan class="ink b">Rarefied</tspan><tspan dx="8">every letter has its own value</tspan></text><text x="104" y="357.8" text-anchor="end" class="s">28 Aug</text><circle cx="118" cy="352.8" r="5.5" class="dot"/><text x="134" y="357.8"><tspan class="ink b">Training</tspan><tspan dx="8">practise with a coach</tspan></text><text x="104" y="444.2" text-anchor="end" class="s">31 Oct</text><circle cx="118" cy="439.2" r="5.5" class="ring"/><text x="134" y="444.2"><tspan class="ink b">Halloween</tspan><tspan dx="8">the first holiday skin</tspan></text></svg>