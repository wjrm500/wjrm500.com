server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Redirects stay relative, so they keep the https://wjrm500.com the reverse proxy was asked
    # for instead of pointing at this container's own http://host:80.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/xml application/rss+xml image/svg+xml;

    include /etc/nginx/security-headers.conf;
    error_page 404 /404.html;

    # --- URLs left over from WordPress ---------------------------------------------------
    # WordPress accepted a trailing slash on every URL; the static pages have none.
    rewrite ^/(.+)/$ /$1 permanent;
    location = /feed { return 301 /feed.xml; }
    location = /comments/feed { return 301 /feed.xml; }
    location = /category/articles { return 301 /articles; }
    location = /sample-page { return 301 /; }
    # Month and day archives, author pages and paginated listings all fold into /articles.
    location ~ "^/\d{4}(/\d{2}){0,2}$" { return 301 /articles; }
    location ~ ^/(page/\d+|author/[^/]+)$ { return 301 /articles; }
    # Bots still probe for WordPress; there is nothing here for them.
    location ~ ^/(wp-admin|wp-login\.php|xmlrpc\.php|wp-json) { return 410; }

    # --- Static files ----------------------------------------------------------------------
    # Hashed build assets never change: cache for a year.
    location /_astro/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /feed.xml {
        types {}
        default_type application/rss+xml;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    # Pages are built as /2025/12/20/slug.html and served without the extension.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }
}
