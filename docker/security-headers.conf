# Security headers. nginx's add_header is not additive across levels: a location that sets any
# add_header of its own drops every header inherited from the server block, so this file is
# included in the server block and again in every location that adds a Cache-Control header.
# HSTS and TLS belong to the reverse proxy in ServerConfig.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options SAMEORIGIN always;
